<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <!-- Simple triangular mark + wordmark to serve as the original logo asset -->
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <g transform="translate(40,20)">
    <path d="M0 160 L120 10 L240 160 Z" fill="url(#g)" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round"/>
    <g transform="translate(280,110)">
      <text x="0" y="0" font-family="Inter, Roboto, sans-serif" font-size="48" font-weight="700" fill="#374151">EmmyTech</text>
      <text x="0" y="28" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#6b7280">Laptop • Gadget • Solar</text>
    </g>
  </g>
</svg>
